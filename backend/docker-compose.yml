name: loccoc-backend

x-service-defaults: &service-defaults
  build:
    context: .
    dockerfile: Dockerfile.service
  restart: unless-stopped
  networks: [loccoc]
  environment: &service-environment
    JWT_SECRET: ${JWT_SECRET:-change-this-local-development-secret-key-at-least-32-bytes}
    INTERNAL_API_KEY: ${INTERNAL_API_KEY:-loccoc-local-internal-key}
    SPRING_PROFILES_ACTIVE: docker
  depends_on:
    flyway:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: loccoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: social_media_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d social_media_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [loccoc]

  redis:
    image: redis:7-alpine
    container_name: loccoc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [loccoc]

  minio:
    image: minio/minio:latest
    platform: linux/amd64
    container_name: loccoc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [loccoc]

  flyway:
    image: redgate/flyway:11-alpine
    platform: linux/amd64
    container_name: loccoc-flyway
    command:
      - -url=jdbc:postgresql://postgres:5432/social_media_ai_db
      - -user=postgres
      - -password=${POSTGRES_PASSWORD:-postgres}
      - -baselineOnMigrate=true
      - -connectRetries=30
      - migrate
    volumes:
      - ./database/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [loccoc]

  identity-service:
    <<: *service-defaults
    container_name: loccoc-identity
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: identity-service }
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/social_media_ai_db
      DB_USERNAME: identity_service_user
      DB_PASSWORD: identity_password
      REDIS_HOST: redis
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OTP_EXPOSE_CODE: ${OTP_EXPOSE_CODE:-true}
    ports: ["8081:8081"]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health"], interval: 10s, timeout: 5s, retries: 20 }

  social-service:
    <<: *service-defaults
    container_name: loccoc-social
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: social-service }
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/social_media_ai_db
      DB_USERNAME: social_service_user
      DB_PASSWORD: social_password
      IDENTITY_SERVICE_URL: http://identity-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    ports: ["8082:8082"]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health"], interval: 10s, timeout: 5s, retries: 20 }

  post-service:
    <<: *service-defaults
    container_name: loccoc-post
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: post-service }
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/social_media_ai_db
      DB_USERNAME: post_service_user
      DB_PASSWORD: post_password
      SOCIAL_SERVICE_URL: http://social-service:8082
      IDENTITY_SERVICE_URL: http://identity-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      MINIO_URL: http://minio:9000
      MINIO_PUBLIC_URL: http://localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      flyway: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports: ["8083:8083"]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health"], interval: 10s, timeout: 5s, retries: 20 }

  notification-service:
    <<: *service-defaults
    container_name: loccoc-notification
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: notification-service }
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/social_media_ai_db
      DB_USERNAME: notification_service_user
      DB_PASSWORD: notification_password
    ports: ["8084:8084"]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health"], interval: 10s, timeout: 5s, retries: 20 }

  chat-service:
    <<: *service-defaults
    container_name: loccoc-chat
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: chat-service }
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/social_media_ai_db
      DB_USERNAME: chat_service_user
      DB_PASSWORD: chat_password
      SOCIAL_SERVICE_URL: http://social-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    ports: ["8085:8085"]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health"], interval: 10s, timeout: 5s, retries: 20 }

  ai-service:
    <<: *service-defaults
    container_name: loccoc-ai
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: ai-service }
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/social_media_ai_db
      DB_USERNAME: ai_service_user
      DB_PASSWORD: ai_password
    ports: ["8086:8086"]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health"], interval: 10s, timeout: 5s, retries: 20 }

  moderation-service:
    <<: *service-defaults
    container_name: loccoc-moderation
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: moderation-service }
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/social_media_ai_db
      DB_USERNAME: moderation_service_user
      DB_PASSWORD: moderation_password
      IDENTITY_SERVICE_URL: http://identity-service:8081
      POST_SERVICE_URL: http://post-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports: ["8087:8087"]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health"], interval: 10s, timeout: 5s, retries: 20 }

  api-gateway:
    <<: *service-defaults
    container_name: loccoc-gateway
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { SERVICE: api-gateway }
    environment:
      <<: *service-environment
      IDENTITY_SERVICE_URL: http://identity-service:8081
      SOCIAL_SERVICE_URL: http://social-service:8082
      POST_SERVICE_URL: http://post-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      CHAT_SERVICE_URL: http://chat-service:8085
      AI_SERVICE_URL: http://ai-service:8086
      MODERATION_SERVICE_URL: http://moderation-service:8087
    depends_on:
      identity-service: { condition: service_healthy }
      social-service: { condition: service_healthy }
      post-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      chat-service: { condition: service_healthy }
      ai-service: { condition: service_healthy }
      moderation-service: { condition: service_healthy }
    ports: ["8080:8080"]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health"], interval: 10s, timeout: 5s, retries: 20 }

networks:
  loccoc:

volumes:
  postgres_data:
  minio_data:
