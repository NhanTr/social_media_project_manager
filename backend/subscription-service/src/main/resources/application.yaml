server:
  port: 8088
spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: subscription-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/social_media_ai_db}
    username: ${DB_USERNAME:subscription_service_user}
    password: ${DB_PASSWORD:subscription_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
app:
  jwt:
    secret: ${JWT_SECRET:change-this-local-development-secret-key-at-least-32-bytes}
  internal-api-key: ${INTERNAL_API_KEY:loccoc-local-internal-key}
  payment:
    sandbox-enabled: ${PAYMENT_SANDBOX_ENABLED:true}
    checkout-base-url: ${SANDBOX_CHECKOUT_BASE_URL:https://localhost:8443/api/v1/payments/sandbox/checkouts}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:local-sandbox-webhook-secret-at-least-32-bytes}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  level:
    org.hibernate.orm.jdbc.error: "OFF"
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
