spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/social_media_ai_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-expiration-minutes=${APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
app.jwt.refresh-token-expiration-days=${APP_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}
app.otp.expiration-minutes=${APP_OTP_EXPIRATION_MINUTES:5}
app.seed.test-user.enabled=false
