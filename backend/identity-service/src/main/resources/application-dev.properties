spring.datasource.url=jdbc:postgresql://postgres:5432/social_media_ai_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.data.redis.host=redis
spring.data.redis.port=6379
app.jwt.secret=${APP_JWT_SECRET:change-this-local-development-secret-key-at-least-32-bytes}
app.jwt.access-token-expiration-minutes=${APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
app.jwt.refresh-token-expiration-days=${APP_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}
app.otp.expiration-minutes=${APP_OTP_EXPIRATION_MINUTES:5}
app.seed.test-user.enabled=true
