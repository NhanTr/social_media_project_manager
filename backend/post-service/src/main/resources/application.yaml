server:
  port: 8083
  tomcat:
    max-swallow-size: 25MB
spring:
  application:
    name: post-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/social_media_ai_db}
    username: ${DB_USERNAME:post_service_user}
    password: ${DB_PASSWORD:post_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
app:
  jwt:
    secret: ${JWT_SECRET:change-this-local-development-secret-key-at-least-32-bytes}
  internal-api-key: ${INTERNAL_API_KEY:loccoc-local-internal-key}
clients:
  social:
    base-url: ${SOCIAL_SERVICE_URL:http://localhost:8082}
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
storage:
  endpoint: ${MINIO_URL:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: loccoc-media
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
