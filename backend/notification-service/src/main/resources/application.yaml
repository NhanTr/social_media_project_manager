server:
  port: 8084
spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/social_media_ai_db}
    username: ${DB_USERNAME:notification_service_user}
    password: ${DB_PASSWORD:notification_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
app:
  jwt:
    secret: ${JWT_SECRET:change-this-local-development-secret-key-at-least-32-bytes}
  internal-api-key: ${INTERNAL_API_KEY:loccoc-local-internal-key}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
springdoc:
  swagger-ui:
    path: /swagger-ui.html
logging:
  level:
    org.hibernate.orm.jdbc.error: "OFF"
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-}]"
